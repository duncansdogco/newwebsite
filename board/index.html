<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Staff Positioning | Duncan's Dog Co</title>
<link rel="icon" href="/assets/favicon-32x32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
:root{
  --black:#0b0b0b;--ink:#161616;--white:#fff;--bg:#f0f1f0;
  --forest:#193419;--green:#2f6b3a;--green-soft:#e4efe5;--green-ink:#1f4a27;
  --terra:#b5562f;--terra-soft:#f7e7df;
  --amber:#f0a12b;--amber-soft:#fdf0d8;--amber-ink:#7a4c0c;
  --line:#e2e3e2;--line-strong:#c7c8c7;--muted:#6d6f6d;--chip:#f3f4f3;
  --serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif;
  --r:6px;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:0}
.micro{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
[hidden]{display:none!important}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--black);background:var(--black);color:#fff;border-radius:var(--r);padding:0 14px;height:38px;font-size:13px;font-weight:700;line-height:1;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.line{background:#fff;color:var(--black);border-color:var(--line-strong)}
.btn.line:hover{border-color:var(--black)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.sm{height:34px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:15px;height:15px;fill:currentColor}

/* ---------- PIN GATE ---------- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#111 url(/assets/team/gate.jpg) center/cover no-repeat;position:relative}
#gate::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.6))}
.gate-card{position:relative;width:100%;max-width:400px;background:#fff;padding:36px 34px 30px;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.gate-card img{width:76px;height:76px;display:block;margin-bottom:18px}
.gate-card .micro{color:var(--green)}
.gate-card h1{font-size:32px;line-height:1;margin:6px 0 8px}
.gate-card p{margin:0;font-size:14px;color:var(--muted)}
.gate-card input{width:100%;height:58px;border:1px solid var(--line-strong);border-radius:var(--r);background:#fff;text-align:center;font-size:28px;letter-spacing:.6em;padding-left:.6em;font-family:var(--serif);color:var(--black);outline:none;margin:22px 0 12px}
.gate-card input:focus{border-color:var(--black)}
.gate-err{color:var(--terra);font-size:13px;min-height:18px;margin-top:10px}

/* ---------- HEADER ---------- */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:44px;height:44px}
.top .ttl{flex:1;min-width:180px}
.top h1{font-size:22px;line-height:1;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-right:6px}
.status .dot{width:8px;height:8px;border-radius:50%;background:#3cb355}
.status.dirty .dot{background:var(--amber)}
.status.off .dot{background:#e0532f}

/* ---------- WEEK ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 90px}
.week{display:flex;align-items:stretch;gap:8px}
.week .nav{width:44px;border:1px solid var(--line-strong);background:#fff;color:var(--black);border-radius:var(--r);font-size:22px;flex-shrink:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex:1}
.day{background:#fff;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 8px 7px;text-align:left;color:var(--black);position:relative;display:flex;flex-direction:column;gap:2px}
.day .wd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.day .num{font-family:var(--serif);font-size:24px;line-height:1}
.day .num small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:4px;font-weight:400}
.day.today{border-color:var(--green)}
.day.today .wd{color:var(--green)}
.day.active{background:var(--forest);border-color:var(--forest);color:#fff}
.day.active .wd,.day.active .num small{color:rgba(255,255,255,.65)}
.day .pip{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.daybar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 12px}
.daybar h2{font-size:30px;line-height:1;flex:1;min-width:240px}
.daybar .quick{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- ALERTS ---------- */
.alerts{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.alert{background:var(--amber-soft);border-left:4px solid var(--amber);color:var(--amber-ink);border-radius:var(--r);padding:9px 12px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.alert.ok{background:var(--green-soft);border-left-color:var(--green);color:var(--green-ink)}
.alert .emo{font-size:15px;line-height:1.2}
.alert b{font-weight:700}

/* ---------- TRAYS ---------- */
.tray{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;transition:background .15s,border-color .15s}
.tray .lbl{min-width:150px;padding-top:4px}
.tray .lbl b{font-family:var(--serif);font-size:16px;display:block}
.tray .hint{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.tray.can-drop{background:var(--green-soft);border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{-webkit-touch-callout:none;display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;font-weight:700;color:var(--black);user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab}
.chip:hover{border-color:var(--black)}
.chip.selected{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);background:var(--green-soft)}
.chip.lifted{opacity:.3}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;font-family:var(--serif);flex-shrink:0}
.empty{font-size:13px;color:var(--muted);padding-top:6px}

/* job chips */
.jchip{-webkit-touch-callout:none;display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:5px 10px 5px 7px;font-size:13px;font-weight:700;color:var(--black);user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;position:relative}
.jchip .emo{font-size:17px;line-height:1}
.jchip.todo{border-left:4px solid var(--amber)}
.jchip.done{background:var(--chip);color:var(--muted);font-weight:400;border-color:var(--line)}
.jchip.done .who{display:inline-flex;margin-left:4px}
.jchip.done .who .av{width:20px;height:20px;font-size:9px;margin-left:-6px;border:2px solid #fff}
.jchip.selected{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);background:var(--green-soft);color:var(--black)}
.jchip.lifted{opacity:.3}

/* ---------- BOARD ---------- */
.pens{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pen{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:320px;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow)}
.pen.can-drop::after{content:"";position:absolute;inset:0;border:3px dashed var(--green);border-radius:12px;pointer-events:none;z-index:2}
.pen.over::after{border-style:solid;background:rgba(47,107,58,.08)}
.pen-head{position:relative;height:132px;background:#333 center/cover no-repeat;color:#fff;display:flex;align-items:flex-end;padding:12px 14px}
.pen-head::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.72))}
.pen[data-pen=office] .pen-head{background-image:url(/assets/team/office.jpg)}
.pen[data-pen=woodland] .pen-head{background-image:url(/assets/team/woodland.jpg)}
.pen[data-pen=sahara] .pen-head{background-image:url(/assets/team/sahara.jpg)}
.pen-head>*{position:relative}
.pen-head .emo{font-size:26px;margin-right:10px;line-height:1}
.pen-head h3{font-size:20px;line-height:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pen-head .micro{color:rgba(255,255,255,.8);margin-top:4px}
.pen-head .tap{margin-left:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:none;background:#fff;color:var(--green-ink);padding:6px 9px;border-radius:var(--r)}
.pen.can-drop .pen-head .tap{display:block}
.pen-body{display:flex;flex-direction:column;flex:1}
.pen-empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;padding:30px 16px}
.pen-empty b{display:block;font-family:var(--serif);font-size:15px;color:var(--black);margin-bottom:3px}

.card{-webkit-touch-callout:none;display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line);position:relative;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;background:#fff}
.card:last-child{border-bottom:none}
.card:hover{background:#fafafa}
.card.lifted{opacity:.3}
.card.selected{box-shadow:inset 0 0 0 2px var(--green)}
.card.can-take{box-shadow:inset 0 0 0 2px var(--green-soft)}
.card.can-take::after{content:"Tap to give job";position:absolute;right:12px;top:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--green-ink);background:var(--green-soft);padding:4px 7px;border-radius:4px}
.card.over{background:var(--green-soft)}
.card .av{width:38px;height:38px;font-size:14px}
.card .who{min-width:0}
.card .name{font-family:var(--serif);font-size:18px;line-height:1.1;color:var(--black);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .jobs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.job{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:6px;padding:3px 4px 3px 6px;font-size:12px;color:var(--ink);line-height:1.2}
.job .emo{font-size:14px;line-height:1}
.job .x{width:18px;height:18px;border:none;background:transparent;color:var(--muted);border-radius:4px;display:grid;place-items:center;font-size:14px;line-height:1;padding:0}
.job .x:hover{background:#fff;color:var(--terra)}
.card .lunch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:80px;padding:7px 10px;border-radius:8px;background:var(--green-soft);line-height:1}
.card .lunch .micro{color:var(--green-ink)}
.card .lunch .t{font-family:var(--serif);font-size:22px;color:var(--green-ink);white-space:nowrap}
.card .lunch.unset{background:var(--amber-soft);border:1px dashed var(--amber)}
.card .lunch.unset .micro{color:var(--amber-ink)}
.card .lunch.unset .t{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--amber-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--amber-soft);color:var(--amber-ink);font-family:var(--sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:999px;line-height:1}

/* ---------- NOTES ---------- */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note.wide{grid-column:1/-1}
.note .micro{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.note .micro .emo{font-size:14px}
.note p{margin:0;font-size:13px;white-space:pre-line}
.note.friday{background:var(--amber-soft);border-color:#f3d9a6}
.note.friday .micro{color:var(--amber-ink)}

/* ---------- PHONE DROP BAR ---------- */
.dropbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:#fff;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.14);padding:8px 8px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;animation:up .15s}
.dropbar .lbl{grid-column:1/-1;text-align:center;font-size:12px;font-weight:700;color:var(--green-ink);padding:2px 0 4px}
.dropbar button{border:2px dashed var(--line-strong);background:#fff;border-radius:10px;padding:8px 2px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--black);line-height:1.1;touch-action:none}
.dropbar button .emo{font-size:22px}
.dropbar button.over,.dropbar button:active{border-color:var(--green);border-style:solid;background:var(--green-soft)}
.dropbar button.cur{opacity:.3}

/* ---------- DRAG GHOST ---------- */
.drag-ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:200;box-shadow:0 18px 40px rgba(0,0,0,.28);opacity:.96;background:#fff;border-radius:8px}

/* ---------- SHEETS ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .12s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 20px 30px;animation:up .16s}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media(min-width:700px){.scrim{align-items:center;padding:20px}.sheet{border-radius:14px;padding:26px}}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:24px;flex:1;display:flex;align-items:center;gap:10px}
.sheet-head .x{width:36px;height:36px;border:1px solid var(--line-strong);background:#fff;border-radius:var(--r);font-size:20px;line-height:1}
.field{margin-bottom:18px}
.field .micro{display:block;margin-bottom:8px;color:var(--black)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-strong);background:#fff;color:var(--black);border-radius:8px;padding:9px 13px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.seg button .emo{font-size:15px}
.seg button.on{background:var(--forest);border-color:var(--forest);color:#fff}
.seg button.amber.on{background:var(--amber);border-color:var(--amber);color:var(--black)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .grow{flex:1;min-width:0;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.row .grow .emo{font-size:17px}
.row input.inline{flex:1;border:none;background:transparent;font-weight:700;font-size:15px;outline:none;min-width:0;padding:4px 0;font-family:var(--serif)}
.row input.inline:focus{box-shadow:0 1px 0 var(--black)}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:var(--r);color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.icon-btn svg{width:16px;height:16px;fill:currentColor}
.icon-btn:hover{border-color:var(--black);color:var(--black)}
.icon-btn.del:hover{border-color:var(--terra);color:var(--terra)}
.icon-btn:disabled{opacity:.3}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;height:42px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 12px;background:#fff;outline:none;min-width:0}
.addrow input:focus{border-color:var(--black)}
.av-btn{border:none;padding:0}
textarea.ta{width:100%;min-height:74px;border:1px solid var(--line-strong);border-radius:var(--r);padding:10px 12px;background:#fff;resize:vertical;outline:none}
textarea.ta:focus{border-color:var(--black)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:300;animation:fade .2s}

/* ---------- SHARE CARD ---------- */
#shareWrap{position:fixed;left:-20000px;top:0}
.share{width:1000px;background:#fff;font-family:var(--sans);color:var(--black)}
.share .hd{position:relative;height:210px;background:#222 url(/assets/team/share.jpg) center 40%/cover no-repeat;color:#fff;display:flex;align-items:flex-end;padding:30px 44px}
.share .hd::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.75))}
.share .hd>*{position:relative}
.share .hd img{width:70px;height:70px;margin-right:20px}
.share .hd .micro{color:rgba(255,255,255,.75)}
.share .hd h1{font-size:40px;line-height:1;color:#fff;margin-top:4px}
.share .hd .date{margin-left:auto;text-align:right}
.share .hd .date .d{font-family:var(--serif);font-size:30px;line-height:1}
.share .hd .date .micro{margin-top:6px;display:block}
.share .body{padding:6px 44px 30px}
.share table{width:100%;border-collapse:collapse;font-size:15px}
.share th{text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:22px 10px 8px;border-bottom:2px solid var(--black)}
.share th:first-child,.share td:first-child{padding-left:0}
.share td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.share tr.grp td{padding:18px 0 6px;border-bottom:none}
.share .band{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;font-weight:700}
.share .band .emo{font-size:20px}
.share .band.office{color:var(--black)}.share .band.woodland{color:var(--green)}.share .band.sahara{color:var(--terra)}
.share td.who{font-family:var(--serif);font-size:19px;white-space:nowrap}
.share td.who .av{display:inline-grid;vertical-align:middle;margin-right:10px;width:28px;height:28px;font-size:11px}
.share td.lunch{font-family:var(--serif);font-size:20px;white-space:nowrap}
.share td.lunch .tag{margin-left:8px;vertical-align:middle}
.share .job{margin:2px 4px 2px 0;padding:3px 8px 3px 6px}
.share .muted{color:var(--line-strong)}
.share .todo{margin-top:14px;padding:10px 12px;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:var(--r);font-size:13px;color:var(--amber-ink)}
.share .foot{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin-top:22px}
.share .fbox{border-top:2px solid var(--black);padding:10px 0 0;font-size:13px;white-space:pre-line}
.share .fbox .micro{display:block;color:var(--black);margin-bottom:5px}
.share .fbox.wide{grid-column:1/-1;margin-top:14px}
.share .fbox.fri{border-top-color:var(--amber)}
.share .ft{margin-top:26px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}

@media(max-width:900px){
  .pens{grid-template-columns:1fr}
  .pen{min-height:0}
  .pen-head{height:104px}
  .pen-empty{padding:18px}
  .top .in{padding:10px 12px;gap:8px 10px}
  .top h1{font-size:19px}.top img{width:38px;height:38px}
  .toolbar{flex:1 0 100%;justify-content:space-between}
  .toolbar .lbl{display:none}
  .toolbar .btn{padding:0 10px;height:34px}
  .status{margin-right:auto}
  .daybar{margin:14px 0 10px}
  .daybar h2{font-size:22px;min-width:0}
  .daybar .quick{flex:1 0 100%}
  .day{padding:7px 5px 6px}
  .day .wd{font-size:9px;letter-spacing:.06em;padding-right:8px}
  .day .num{font-size:20px}.day .num small{display:none}
  .day .pip{top:7px;right:5px;width:6px;height:6px}
  .tray{flex-direction:column;gap:8px;padding:12px}
  .tray .lbl{min-width:0;padding-top:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .chips{flex:none}
  .notes{grid-template-columns:1fr}
  .wrap{padding:12px 12px 80px}
  .card.can-take::after{top:auto;bottom:6px}
}
@media print{
  body{background:#fff}
  #app,#gate,.scrim,.toast{display:none!important}
  #shareWrap{position:static}
  .share{width:auto}
  .share .hd,.share .band,.share .tag,.share .todo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- ===================== PIN GATE ===================== -->
<div id="gate">
  <form class="gate-card" id="gateForm">
    <img src="/assets/logo.png" alt="Duncan's Dog Co">
    <p class="micro">Duncan's Dog Co · Team</p>
    <h1>Staff Positioning</h1>
    <p>Enter the team PIN to open the board.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="····" aria-label="Team PIN">
    <button class="btn green" type="submit" id="gateBtn" style="width:100%;height:48px">Open the board</button>
    <div class="gate-err" id="gateErr"></div>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <header class="top"><div class="in">
    <img src="/assets/logo.png" alt="">
    <div class="ttl"><p class="micro">Duncan's Dog Co · Team</p><h1>Staff Positioning</h1></div>
    <div class="toolbar">
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Loading</span></span>
      <button class="btn line sm" id="btnShare" title="Share as image"><svg viewBox="0 0 24 24"><path d="M12 3l4 4h-3v7h-2V7H8l4-4Zm-7 9h2v7h10v-7h2v9H5v-9Z"/></svg><span class="lbl">Share image</span></button>
      <button class="btn line sm" id="btnPrint" title="Print"><svg viewBox="0 0 24 24"><path d="M7 3h10v4H7V3Zm-3 6h16a1 1 0 0 1 1 1v7h-4v4H7v-4H3v-7a1 1 0 0 1 1-1Zm5 7v3h6v-3H9Z"/></svg><span class="lbl">Print</span></button>
      <button class="btn line sm" id="btnTeam" title="Manage team"><svg viewBox="0 0 24 24"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 19c0-3.3 3-6 7-6s7 2.7 7 6H2Zm14 0c0-1.8-.6-3.4-1.6-4.7 3.3-.5 7.6 1 7.6 4.7h-6Z"/></svg><span class="lbl">Team</span></button>
      <button class="btn line sm" id="btnSettings" title="Jobs, lunches and notes"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3.5H9l-.3 2.6a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.4-1c.5.4 1.1.8 1.7 1L9 20.5h6l.3-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.5ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg><span class="lbl">Setup</span></button>
    </div>
  </div></header>

  <div class="wrap">
    <div class="week">
      <button class="nav" id="prevWeek" aria-label="Previous week">‹</button>
      <div class="days" id="days"></div>
      <button class="nav" id="nextWeek" aria-label="Next week">›</button>
    </div>

    <div class="daybar">
      <h2 id="dayTitle"></h2>
      <div class="quick">
        <button class="btn line sm" id="btnCopyYesterday">Copy yesterday</button>
        <button class="btn line sm" id="btnCopyLastWeek">Copy last week</button>
        <button class="btn line sm" id="btnClearDay">Clear day</button>
      </div>
    </div>

    <div class="alerts" id="alerts"></div>

    <section class="tray" id="bench" data-drop="bench">
      <div class="lbl"><b>👋 Not positioned</b><span class="hint" id="benchHint">Tap a name, then tap a pen. Or drag.</span></div>
      <div class="chips" id="benchChips"></div>
    </section>

    <section class="tray" id="jobTray">
      <div class="lbl"><b id="jobTitle">📋 Jobs today</b><span class="hint" id="jobHint">Tap a job, then tap the person doing it. Or drag it onto them.</span></div>
      <div class="chips" id="jobChips"></div>
    </section>

    <section class="pens" id="pens"></section>
    <section class="notes" id="notes"></section>
  </div>
</div>

<div class="dropbar" id="dropBar" hidden>
  <div class="lbl" id="dropBarLbl"></div>
  <button type="button" data-drop="bench"><span class="emo">👋</span>Not positioned</button>
  <button type="button" data-drop="office"><span class="emo">🏠</span>Office</button>
  <button type="button" data-drop="woodland"><span class="emo">🌳</span>Woodland</button>
  <button type="button" data-drop="sahara"><span class="emo">☀️</span>Sahara / Top</button>
</div>

<div id="shareWrap"><div class="share" id="shareCard"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ===================== CONSTANTS ===================== */
const API = '/api/team-board';
const PENS = [
  { key:'office',   label:'Office',           emo:'🏠' },
  { key:'woodland', label:'Woodland Pen',     emo:'🌳' },
  { key:'sahara',   label:'Sahara / Top Pen', emo:'☀️' },
];
const HUES = ['#193419','#2f6b3a','#b5562f','#1c1c1c','#5b4a3a','#3d5a6c','#7a2e2e','#4f5d2f','#8a6a1e','#2b2b5e'];
const DEFAULT_BOARD = () => ({
  v:1,
  staff: ['Holly','Eleanor','Nick','Katie','Alexia','Tyler','Yvonne','Laura'].map((n,i)=>({ id:'s'+(i+1), name:n, hue:HUES[i%HUES.length] })),
  jobs: ['🧼 Clean & disinfect boarding area + poo bin','🗑️ Carpark / office poo bin','🗑️ Woodland poo bin','🧼 Clean & disinfect poo pen','🌿 Jungle sweep & bin (Wed / Fri)','🗑️ Pen poo bin (pen in use)','🚗 Car wash'],
  lunches: ['12:00','12:30','13:00','13:30'],
  notes: {
    penTasks: 'Fill water buckets 🪣 • Poo sweep 🧹',
    fridayClean: 'Poo bins and poo scoops',
    general: 'Ratio: only 1 person out of a pen at any given time.\nLunches: you can swap for an earlier or later lunch, but the dedicated time slots MUST be used.\nPoo bins: do not need doing every day. If they are half full they can be left till the next day.'
  },
  days: {},
  updatedAt: null
});

/* ===================== STATE ===================== */
let board = null;
let pin = '';
let localMode = false;
let dirty = false, saving = false, saveTimer = null;
let viewDate = isoDate(new Date());
let weekStart = mondayOf(viewDate);
let selected = null;      // staff id picked for tap-to-place
let selectedJob = null;   // job name picked for tap-to-give

/* ===================== DATE HELPERS ===================== */
function isoDate(d){ const x = new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function mondayOf(s){ const d=parseISO(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return isoDate(d); }
function fmtLong(s){ return parseISO(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}); }
function fmtShort(s){ return parseISO(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
function isFriday(s){ return parseISO(s).getDay()===5; }
const DAYABBR=['sun','mon','tue','wed','thu','fri','sat'];
const TODAY = isoDate(new Date());

/* ===================== JOB HELPERS ===================== */
const EMO_RE=/^[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{20E3}]+/u;
function jobEmoji(name){
  const m=name.match(EMO_RE); if(m) return m[0];
  const k=name.toLowerCase();
  if(/\bcar\b|\bvan\b|vehicle/.test(k)) return '🚗';
  if(k.includes('jungle')) return '🌿';
  if(k.includes('water')) return '🪣';
  if(k.includes('sweep')) return '🧹';
  if(k.includes('disinfect')||k.includes('clean')) return '🧼';
  if(k.includes('bin')) return '🗑️';
  if(k.includes('radio')) return '📻';
  if(k.includes('feed')||k.includes('food')) return '🍖';
  if(k.includes('walk')||k.includes('lead')) return '🐕';
  return '📋';
}
function jobLabel(name){ return name.replace(EMO_RE,'').trim(); }
function jobDays(name){ // day tags inside brackets, e.g. "(Wed / Fri)"
  const inside=(name.match(/\(([^)]*)\)/g)||[]).join(' ').toLowerCase();
  const found=DAYABBR.filter(d=>new RegExp('\\b'+d,'i').test(inside));
  return found.length?found:null;
}
function jobsForDay(iso){ const wd=DAYABBR[parseISO(iso).getDay()]; return board.jobs.filter(j=>{ const ds=jobDays(j); return !ds || ds.includes(wd); }); }
function jobChipHTML(name){ return `<span class="emo">${jobEmoji(name)}</span>${esc(jobLabel(name))}`; }

/* ===================== DATA HELPERS ===================== */
function blankDay(){ return { office:[], woodland:[], sahara:[], lunch:{}, radio:{}, jobs:{} }; }
function getDay(iso, create){ if(!board.days[iso]){ if(!create) return blankDay(); board.days[iso]=blankDay(); } return board.days[iso]; }
function staffById(id){ return board.staff.find(s=>s.id===id); }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function penOf(day,id){ return PENS.find(p=>day[p.key].includes(id))?.key || null; }
function positionedIds(day){ return PENS.flatMap(p=>day[p.key]); }
function dayHasContent(iso){ const d=board.days[iso]; return !!d && PENS.some(p=>d[p.key].length); }
function holdersOf(day, job){ return positionedIds(day).filter(id=>(day.jobs[id]||[]).includes(job)); }
function cleanDay(d){
  const ids=new Set(board.staff.map(s=>s.id));
  PENS.forEach(p=>d[p.key]=d[p.key].filter(id=>ids.has(id)));
  for(const k of ['lunch','radio','jobs']) for(const id of Object.keys(d[k])) if(!ids.has(id)) delete d[k][id];
  return d;
}
function move(id, target){
  const d=getDay(viewDate,true);
  PENS.forEach(p=>d[p.key]=d[p.key].filter(x=>x!==id));
  if(target==='bench'){ delete d.lunch[id]; delete d.radio[id]; delete d.jobs[id]; }
  else d[target].push(id);
  selected=null; commit();
}
function giveJob(id, job){
  const d=getDay(viewDate,true); const arr=d.jobs[id]||[];
  if(!arr.includes(job)) arr.push(job); d.jobs[id]=arr;
  selectedJob=null; commit(); toast(jobLabel(job)+' → '+(staffById(id)?.name||''));
}
function takeJob(id, job){
  const d=getDay(viewDate,true); const arr=(d.jobs[id]||[]).filter(j=>j!==job);
  if(arr.length) d.jobs[id]=arr; else delete d.jobs[id]; commit();
}

/* ===================== PERSISTENCE ===================== */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setStatus(text, cls){ const el=document.getElementById('status'); el.className='status'+(cls?' '+cls:''); document.getElementById('statusText').textContent=text; }
function timeNow(){ return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function cacheLocal(){ try{ localStorage.setItem('ddc-board', JSON.stringify(board)); }catch{} }
function readLocal(){ try{ const s=localStorage.getItem('ddc-board'); return s?JSON.parse(s):null; }catch{ return null; } }

async function api(method, body){
  const res = await fetch(API, { method, headers:{ 'x-team-pin':pin, 'content-type':'application/json' }, body: body?JSON.stringify(body):undefined, cache:'no-store' });
  if(res.status===401) throw new Error('bad-pin');
  if(res.status===404) throw new Error('no-api');
  if(!res.ok) throw new Error('http-'+res.status);
  return res.json();
}
function commit(){ dirty=true; cacheLocal(); render(); setStatus('Saving…','dirty'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,700); }
async function saveNow(){
  if(!dirty || saving) return;
  if(localMode){ dirty=false; setStatus('Saved on this device only','off'); return; }
  saving=true;
  try{
    const r = await api('PUT', board);
    board.updatedAt = r.updatedAt; dirty=false; cacheLocal();
    setStatus('Saved '+timeNow());
  }catch(e){
    if(e.message==='bad-pin'){ logout('The PIN has changed. Please enter the new one.'); }
    else { setStatus('Offline, will retry','off'); setTimeout(()=>{ saving=false; saveNow(); }, 8000); return; }
  }
  saving=false;
}
async function pollRemote(){
  if(localMode || dirty || saving || document.hidden || drag) return;
  try{
    const remote = await api('GET');
    if(remote && remote.updatedAt && remote.updatedAt!==board.updatedAt){ board=remote; cacheLocal(); render(); setStatus('Updated by the team '+timeNow()); toast('Board updated by someone on the team'); }
  }catch{}
}

/* ===================== LOGIN ===================== */
async function tryOpen(p){
  pin=p;
  const btn=document.getElementById('gateBtn'); btn.disabled=true; btn.textContent='Opening…';
  const err=document.getElementById('gateErr'); err.textContent='';
  try{
    const remote = await api('GET');
    board = remote || DEFAULT_BOARD();
    if(!remote){ dirty=true; }
    localMode=false;
    try{ localStorage.setItem('ddc-team-pin', pin); }catch{}
    enter();
    if(dirty) saveNow(); else setStatus('Up to date');
  }catch(e){
    if(e.message==='bad-pin'){ err.textContent='That PIN is not right. Try again.'; }
    else if(e.message==='no-api' || e instanceof TypeError){
      localMode=true; board = readLocal() || DEFAULT_BOARD();
      enter(); setStatus('Saved on this device only','off');
    } else { err.textContent='Could not reach the board. Check your connection and try again.'; }
  }
  btn.disabled=false; btn.textContent='Open the board';
}
function enter(){ document.getElementById('gate').hidden=true; document.getElementById('app').hidden=false; render(); }
function logout(msg){
  try{ localStorage.removeItem('ddc-team-pin'); }catch{}
  document.getElementById('app').hidden=true; document.getElementById('gate').hidden=false;
  document.getElementById('gateErr').textContent=msg||''; document.getElementById('pin').value='';
}
document.getElementById('gateForm').addEventListener('submit', e=>{ e.preventDefault(); const v=document.getElementById('pin').value.trim(); if(v) tryOpen(v); });

/* ===================== RENDER ===================== */
function render(){ renderDays(); renderDayBar(); renderBench(); renderJobs(); renderPens(); renderAlerts(); renderNotes(); updateDropBar(); }

function renderDays(){
  const wrap=document.getElementById('days'); wrap.innerHTML='';
  for(let i=0;i<7;i++){
    const iso=addDays(weekStart,i); const d=parseISO(iso);
    const b=document.createElement('button'); b.type='button';
    b.className='day'+(iso===viewDate?' active':'')+(iso===TODAY?' today':'');
    b.innerHTML=`<span class="wd">${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><span class="num">${d.getDate()}<small>${d.toLocaleDateString('en-GB',{month:'short'})}</small></span>${dayHasContent(iso)?'<i class="pip"></i>':''}`;
    b.onclick=()=>{ viewDate=iso; selected=null; selectedJob=null; render(); };
    wrap.appendChild(b);
  }
}
function renderDayBar(){
  document.getElementById('dayTitle').textContent=fmtLong(viewDate);
  document.getElementById('btnCopyLastWeek').disabled=!dayHasContent(addDays(viewDate,-7));
  document.getElementById('btnCopyYesterday').disabled=!dayHasContent(addDays(viewDate,-1));
  document.getElementById('btnClearDay').disabled=!dayHasContent(viewDate);
}
function renderBench(){
  const d=getDay(viewDate); const wrap=document.getElementById('benchChips'); wrap.innerHTML='';
  const free=board.staff.filter(s=>!penOf(d,s.id));
  if(!board.staff.length){ wrap.innerHTML='<div class="empty">No team yet. Tap <b>Team</b> to add people.</div>'; }
  else if(!free.length){ wrap.innerHTML='<div class="empty">✅ Everyone is positioned.</div>'; }
  free.forEach(s=>{
    const el=document.createElement('div'); el.className='chip'+(selected===s.id?' selected':'');
    el.innerHTML=`<span class="av" style="background:${s.hue}">${initials(s.name)}</span>${esc(s.name)}`;
    el.addEventListener('click',()=>{ if(dragMoved) return; selectedJob=null; selected = selected===s.id?null:s.id; render(); });
    attachDrag(el,{kind:'staff',id:s.id}); wrap.appendChild(el);
  });
  document.getElementById('bench').classList.toggle('can-drop', !!selected && !!penOf(d,selected));
  document.getElementById('benchHint').textContent = selected ? 'Now tap a pen for '+(staffById(selected)?.name||'')+'.' : 'Tap a name, then tap a pen. Or drag.';
}
function renderJobs(){
  const d=getDay(viewDate); const wrap=document.getElementById('jobChips'); wrap.innerHTML='';
  const jobs=jobsForDay(viewDate); const positioned=positionedIds(d);
  let todo=0;
  if(!jobs.length) wrap.innerHTML='<div class="empty">No jobs set up. Add them under <b>Setup</b>.</div>';
  jobs.forEach(j=>{
    const holders=holdersOf(d,j); if(!holders.length) todo++;
    const el=document.createElement('div'); el.className='jchip '+(holders.length?'done':'todo')+(selectedJob===j?' selected':'');
    el.innerHTML=jobChipHTML(j)+(holders.length?`<span class="who">${holders.map(id=>{const s=staffById(id);return `<span class="av" style="background:${s.hue}" title="${esc(s.name)}">${initials(s.name)}</span>`;}).join('')}</span>`:'');
    el.title=holders.length?'Done by '+holders.map(id=>staffById(id).name).join(', ')+'. Tap to add someone else.':'Nobody has this yet';
    el.addEventListener('click',()=>{ if(dragMoved) return; selected=null; selectedJob = selectedJob===j?null:j; render(); });
    attachDrag(el,{kind:'job',job:j}); wrap.appendChild(el);
  });
  document.getElementById('jobTitle').textContent = todo? `📋 ${todo} job${todo===1?'':'s'} to allocate` : '📋 All jobs allocated';
  document.getElementById('jobHint').textContent = selectedJob ? (positioned.length? 'Now tap the person doing "'+jobLabel(selectedJob)+'".' : 'Position someone first, then tap them to give this job.') : 'Tap a job, then tap the person doing it. Or drag it onto them.';
}
function renderPens(){
  const d=getDay(viewDate); const wrap=document.getElementById('pens'); wrap.innerHTML='';
  PENS.forEach(p=>{
    const pen=document.createElement('section'); pen.className='pen'; pen.dataset.pen=p.key; pen.dataset.drop=p.key;
    if(selected && penOf(d,selected)!==p.key) pen.classList.add('can-drop');
    const ids=d[p.key];
    pen.innerHTML=`<div class="pen-head"><span class="emo">${p.emo}</span><div><h3>${p.label}</h3><div class="micro">${ids.length? ids.length+(ids.length===1?' person':' people'):'Nobody positioned'}</div></div><span class="tap">Place here</span></div><div class="pen-body"></div>`;
    pen.addEventListener('click',e=>{ if(selected && !e.target.closest('.card')) move(selected,p.key); });
    const body=pen.querySelector('.pen-body');
    if(!ids.length) body.innerHTML=`<div class="pen-empty"><b>Empty</b>Tap a name above, then tap here.</div>`;
    ids.forEach(id=>{ const s=staffById(id); if(!s) return;
      const card=document.createElement('div'); card.className='card'+(selected===id?' selected':'')+(selectedJob&&!(d.jobs[id]||[]).includes(selectedJob)?' can-take':''); card.dataset.id=id; card.dataset.take='1';
      const lunch=d.lunch[id]; const jobs=d.jobs[id]||[];
      card.innerHTML=`<span class="av" style="background:${s.hue}">${initials(s.name)}</span>
        <div class="who"><div class="name">${esc(s.name)}${d.radio[id]?'<span class="tag"><span class="emo">📻</span>Radio 1st</span>':''}</div>${jobs.length?`<div class="jobs">${jobs.map(j=>`<span class="job" data-job="${esc(j)}">${jobChipHTML(j)}<button class="x" type="button" title="Remove job" aria-label="Remove ${esc(jobLabel(j))}">×</button></span>`).join('')}</div>`:''}</div>
        <div class="lunch ${lunch?'':'unset'}"><span class="micro">🍽 Lunch</span><span class="t">${lunch?esc(lunch):'Not set'}</span></div>`;
      card.addEventListener('click',e=>{
        if(dragMoved) return; e.stopPropagation();
        const x=e.target.closest('.job .x'); if(x){ takeJob(id, x.parentElement.dataset.job); return; }
        if(selectedJob){ giveJob(id, selectedJob); return; }
        if(selected && selected!==id){ move(selected,p.key); return; }
        openCardSheet(id);
      });
      attachDrag(card,{kind:'staff',id}); body.appendChild(card);
    });
    wrap.appendChild(pen);
  });
}
function renderAlerts(){
  const d=getDay(viewDate); const out=[];
  const positioned=positionedIds(d);
  PENS.forEach(p=>{
    if(!d[p.key].length && positioned.length) out.push(`<span class="emo">${p.emo}</span><span>Nobody in <b>${p.label}</b>.</span>`);
    const bySlot={};
    d[p.key].forEach(id=>{ const l=d.lunch[id]; if(l){ (bySlot[l]=bySlot[l]||[]).push(staffById(id)?.name); } });
    Object.entries(bySlot).forEach(([slot,names])=>{ if(names.length>1) out.push(`<span class="emo">⚠️</span><span><b>${names.join(' and ')}</b> both on lunch at ${slot} in ${p.label}. Only one person out of a pen at a time.</span>`); });
  });
  const noLunch=positioned.filter(id=>!d.lunch[id]).map(id=>staffById(id)?.name).filter(Boolean);
  if(positioned.length && noLunch.length) out.push(`<span class="emo">🍽</span><span>No lunch slot yet for <b>${noLunch.join(', ')}</b>.</span>`);
  const todo=jobsForDay(viewDate).filter(j=>!holdersOf(d,j).length);
  if(positioned.length && todo.length) out.push(`<span class="emo">📋</span><span>Still needs someone: <b>${todo.map(jobLabel).join(', ')}</b>.</span>`);
  const wrap=document.getElementById('alerts');
  if(!out.length && positioned.length) wrap.innerHTML=`<div class="alert ok"><span class="emo">✅</span><span>Every pen covered, lunches spread out, all jobs allocated.</span></div>`;
  else wrap.innerHTML=out.map(a=>`<div class="alert">${a}</div>`).join('');
}
function renderNotes(){
  const n=board.notes; const fri=isFriday(viewDate);
  document.getElementById('notes').innerHTML=`
    <div class="note"><span class="micro"><span class="emo">🌳</span>Woodland pen · every day</span><p>${esc(n.penTasks)}</p></div>
    <div class="note"><span class="micro"><span class="emo">☀️</span>Sahara / Top pen · every day</span><p>${esc(n.penTasks)}</p></div>
    ${fri?`<div class="note friday wide"><span class="micro"><span class="emo">🧹</span>Friday clean</span><p>${esc(n.fridayClean)}</p></div>`:''}
    <div class="note wide"><span class="micro"><span class="emo">📌</span>General notes</span><p>${esc(n.general)}</p></div>`;
}

/* ===================== DRAG (pointer events) ===================== */
let dragMoved=false;
let drag=null; // the one drag in progress, so a lost pointerup can never leave a name stuck
function endDrag(dropTarget){
  if(!drag) return;
  const d=drag; drag=null;
  if(d.raf) cancelAnimationFrame(d.raf);
  updateDropBar();
  window.removeEventListener('pointermove',d.onMove); window.removeEventListener('pointerup',d.onUp); window.removeEventListener('pointercancel',d.onUp);
  try{ d.el.releasePointerCapture(d.pointerId); }catch{}
  d.ghost?.remove(); d.el.classList.remove('lifted');
  document.querySelectorAll('.drag-ghost').forEach(g=>g.remove());
  document.querySelectorAll('.lifted,.can-drop,.over,.can-take').forEach(z=>z.classList.remove('lifted','can-drop','over','can-take'));
  if(!d.active){ dragMoved=false; return; }
  if(dropTarget){
    if(d.isStaff){ const target=dropTarget.dataset.drop; if(target!==d.curZone) move(d.payload.id,target); else render(); }
    else giveJob(dropTarget.dataset.id, d.payload.job);
  } else render();
  setTimeout(()=>{ dragMoved=false; },50);
}
function attachDrag(el,payload){
  el.addEventListener('contextmenu', e=>e.preventDefault());
  el.addEventListener('pointerdown', e=>{
    if(!drag) dragMoved=false;
    if(e.button && e.button!==0) return;
    if(e.target.closest('.job .x')) return;
    if(drag) endDrag(null); // a previous drag never finished: clear it first
    const isStaff=payload.kind==='staff';
    const d={ el, payload, isStaff, pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, ghost:null, active:false, lastTarget:null,
      curZone:isStaff?(penOf(getDay(viewDate),payload.id)||'bench'):null };
    dragMoved=false;
    try{ el.setPointerCapture(e.pointerId); }catch{}
    d.onMove=ev=>{
      if(ev.pointerId!==d.pointerId) return;
      const dx=ev.clientX-d.startX, dy=ev.clientY-d.startY;
      d.lastX=ev.clientX; d.lastY=ev.clientY;
      if(!d.active){ if(Math.hypot(dx,dy)<6) return; d.active=true; dragMoved=true;
        updateDropBar(); d.raf=requestAnimationFrame(autoScroll);
        d.ghost=el.cloneNode(true); d.ghost.classList.add('drag-ghost'); d.ghost.classList.remove('selected'); d.ghost.style.width=el.offsetWidth+'px'; document.body.appendChild(d.ghost); el.classList.add('lifted');
        if(isStaff) document.querySelectorAll('[data-drop]').forEach(z=>{ if(z.dataset.drop!==d.curZone) z.classList.add('can-drop'); });
        else document.querySelectorAll('.card[data-take]').forEach(c=>c.classList.add('can-take'));
      }
      d.ghost.style.transform=`translate(${ev.clientX}px,${ev.clientY}px) translate(-50%,-50%) rotate(-1.5deg)`;
      const t=zoneAt(ev.clientX,ev.clientY,isStaff);
      if(t!==d.lastTarget){ d.lastTarget?.classList.remove('over'); d.lastTarget=t; t?.classList.add('over'); }
    };
    d.onUp=ev=>{
      if(ev.pointerId!==d.pointerId) return;
      const t=(ev.type==='pointerup' && d.active)?zoneAt(ev.clientX,ev.clientY,isStaff):null;
      endDrag(t);
    };
    drag=d;
    window.addEventListener('pointermove',d.onMove); window.addEventListener('pointerup',d.onUp); window.addEventListener('pointercancel',d.onUp);
  });
}
function zoneAt(x,y,isStaff){ const g=document.querySelector('.drag-ghost'); if(g) g.style.display='none'; const el=document.elementFromPoint(x,y); if(g) g.style.display=''; return el?.closest(isStaff?'[data-drop]':'.card[data-take]')||null; }
// While dragging near the top or bottom edge, scroll the page so far-away pens are reachable
function autoScroll(){
  if(!drag||!drag.active) return;
  const bar=document.getElementById('dropBar'); const barH=bar.hidden?0:bar.offsetHeight;
  const m=72, y=drag.lastY, h=innerHeight-barH; let dy=0;
  if(y<m) dy=-Math.ceil((m-y)/m*18); else if(y>h-m && y<h) dy=Math.ceil((y-(h-m))/m*18);
  if(dy){ window.scrollBy(0,dy); const t=zoneAt(drag.lastX,drag.lastY,drag.isStaff); if(t!==drag.lastTarget){ drag.lastTarget?.classList.remove('over'); drag.lastTarget=t; t?.classList.add('over'); } }
  drag.raf=requestAnimationFrame(autoScroll);
}
// On phones, show a fixed bar of pens to drop or tap a name into, so nobody has to scroll with a finger down
function updateDropBar(){
  const bar=document.getElementById('dropBar');
  const activeDrag = drag && drag.active;
  const id = activeDrag ? (drag.isStaff ? drag.payload.id : null) : (selected || null);
  const show = !!id && window.innerWidth<=900;
  bar.hidden=!show; if(!show) return;
  const cur=penOf(getDay(viewDate),id)||'bench'; const name=staffById(id)?.name||'';
  document.getElementById('dropBarLbl').textContent = drag ? `Drop ${name} into…` : `Tap where ${name} goes`;
  bar.querySelectorAll('button').forEach(b=>{ b.classList.toggle('cur', b.dataset.drop===cur); b.classList.remove('over'); });
}
document.querySelectorAll('#dropBar button').forEach(b=>b.addEventListener('click',()=>{ if(selected && !dragMoved){ move(selected,b.dataset.drop); } }));
// Safety nets: never leave a name floating if the page loses focus or the tab is hidden mid-drag
window.addEventListener('blur',()=>endDrag(null));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) endDrag(null); });

/* ===================== SHEETS ===================== */
function sheet(title, bodyHTML){
  closeSheet();
  const scrim=document.createElement('div'); scrim.className='scrim'; scrim.id='sheet';
  scrim.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="x" type="button" aria-label="Close">×</button></div><div class="sheet-body">${bodyHTML}</div></div>`;
  scrim.addEventListener('click',e=>{ if(e.target===scrim) closeSheet(); });
  scrim.querySelector('.x').onclick=closeSheet;
  document.body.appendChild(scrim); return scrim;
}
function closeSheet(){ document.getElementById('sheet')?.remove(); }
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

function openCardSheet(id){
  const s=staffById(id); if(!s) return;
  const d=getDay(viewDate,true); const cur=penOf(d,id);
  const jobs=d.jobs[id]||[]; const todaysJobs=jobsForDay(viewDate);
  const el=sheet(`<span class="av" style="background:${s.hue}">${initials(s.name)}</span>${esc(s.name)}`, `
    <div class="field"><span class="micro">Position</span><div class="seg" id="segPen">${PENS.map(p=>`<button type="button" class="${cur===p.key?'on':''}" data-v="${p.key}"><span class="emo">${p.emo}</span>${p.label}</button>`).join('')}</div></div>
    <div class="field"><span class="micro">🍽 Lunch</span><div class="seg" id="segLunch"><button type="button" data-v="" class="${d.lunch[id]?'':'on'}">None</button>${board.lunches.map(l=>`<button type="button" data-v="${l}" class="${d.lunch[id]===l?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="field"><span class="micro">📻 Radio</span><div class="seg"><button type="button" id="radioBtn" class="amber ${d.radio[id]?'on':''}">Radio 1st</button></div></div>
    <div class="field"><span class="micro">📋 Jobs</span><div class="seg" id="segJobs">${todaysJobs.map(j=>`<button type="button" data-v="${esc(j)}" class="${jobs.includes(j)?'on':''}">${jobChipHTML(j)}</button>`).join('')}${todaysJobs.length?'':'<span class="hint">No jobs set up yet. Add them under Setup.</span>'}</div></div>
    <div class="sheet-actions"><button class="btn" type="button" id="doneBtn">Done</button><button class="btn line" type="button" id="unpos">Take off today's board</button></div>`);
  el.querySelectorAll('#segPen button').forEach(b=>b.onclick=()=>{ const t=b.dataset.v; PENS.forEach(p=>d[p.key]=d[p.key].filter(x=>x!==id)); d[t].push(id); el.querySelectorAll('#segPen button').forEach(x=>x.classList.toggle('on',x===b)); commit(); });
  el.querySelectorAll('#segLunch button').forEach(b=>b.onclick=()=>{ const v=b.dataset.v; if(v) d.lunch[id]=v; else delete d.lunch[id]; el.querySelectorAll('#segLunch button').forEach(x=>x.classList.toggle('on',x===b)); commit(); });
  el.querySelector('#radioBtn').onclick=e=>{ if(d.radio[id]) delete d.radio[id]; else d.radio[id]=true; e.currentTarget.classList.toggle('on',!!d.radio[id]); commit(); };
  el.querySelectorAll('#segJobs button').forEach(b=>b.onclick=()=>{ const j=b.dataset.v; const arr=d.jobs[id]||[]; const i=arr.indexOf(j); if(i>=0) arr.splice(i,1); else arr.push(j); if(arr.length) d.jobs[id]=arr; else delete d.jobs[id]; b.classList.toggle('on',i<0); commit(); });
  el.querySelector('#doneBtn').onclick=closeSheet;
  el.querySelector('#unpos').onclick=()=>{ move(id,'bench'); closeSheet(); };
}

function openTeamSheet(){
  const el=sheet('👋 Team', `
    <p class="hint">Add people as they join, remove them when they leave. Tap a name to rename it, tap the circle to change its colour.</p>
    <div class="list" id="teamList"></div>
    <form class="addrow" id="addStaff"><input id="newName" placeholder="Add a team member" autocomplete="off" maxlength="30"><button class="btn" type="submit">Add</button></form>`);
  const list=el.querySelector('#teamList');
  const draw=()=>{
    list.innerHTML='';
    if(!board.staff.length) list.innerHTML='<div class="empty">Nobody yet. Add your first team member below.</div>';
    board.staff.forEach((s,idx)=>{
      const row=document.createElement('div'); row.className='row';
      row.innerHTML=`<button type="button" class="av av-btn" style="background:${s.hue}" title="Change colour">${initials(s.name)}</button><input class="inline" value="${esc(s.name)}" maxlength="30" aria-label="Name"><button type="button" class="icon-btn" title="Move up" ${idx===0?'disabled':''}><svg viewBox="0 0 24 24"><path d="m12 6-7 7 1.4 1.4L12 8.8l5.6 5.6L19 13l-7-7Z"/></svg></button><button type="button" class="icon-btn del" title="Remove"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7Zm3-4h6l1 2h4v2H4V5h4l1-2Z"/></svg></button>`;
      const [avBtn,inp,upBtn,delBtn]=row.children;
      avBtn.onclick=()=>{ s.hue=HUES[(HUES.indexOf(s.hue)+1)%HUES.length]; avBtn.style.background=s.hue; commit(); };
      inp.onchange=()=>{ const v=inp.value.trim(); if(v){ s.name=v; avBtn.textContent=initials(v); commit(); } else inp.value=s.name; };
      upBtn.onclick=()=>{ board.staff.splice(idx,1); board.staff.splice(idx-1,0,s); commit(); draw(); };
      delBtn.onclick=()=>{ if(!confirm(`Remove ${s.name} from the team? They will come off every day they are positioned.`)) return; board.staff=board.staff.filter(x=>x!==s); Object.values(board.days).forEach(cleanDay); commit(); draw(); };
      list.appendChild(row);
    });
  };
  draw();
  el.querySelector('#addStaff').onsubmit=e=>{ e.preventDefault(); const inp=el.querySelector('#newName'); const v=inp.value.trim(); if(!v) return;
    board.staff.push({ id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:v, hue:HUES[board.staff.length%HUES.length] }); inp.value=''; commit(); draw(); inp.focus(); };
  el.querySelector('#newName').focus();
}

function openSettingsSheet(){
  const el=sheet('⚙️ Setup', `
    <div class="field"><span class="micro">📋 Jobs</span><p class="hint" style="margin-bottom:8px">Start a job with an emoji to pick its icon, or one is chosen for you. Put days in brackets, like "(Wed / Fri)", and it only shows on those days.</p><div class="list" id="jobList"></div><form class="addrow" id="addJob"><input placeholder="e.g. 🪣 Fill water buckets" maxlength="60" autocomplete="off"><button class="btn" type="submit">Add</button></form></div>
    <div class="field"><span class="micro">🍽 Lunch slots</span><div class="list" id="lunchList"></div><form class="addrow" id="addLunch"><input placeholder="e.g. 14:00" maxlength="8" autocomplete="off"><button class="btn" type="submit">Add</button></form></div>
    <div class="field"><span class="micro">Pen daily tasks</span><textarea class="ta" id="nPen" rows="2">${esc(board.notes.penTasks)}</textarea></div>
    <div class="field"><span class="micro">Friday clean</span><textarea class="ta" id="nFri" rows="2">${esc(board.notes.fridayClean)}</textarea></div>
    <div class="field"><span class="micro">General notes</span><textarea class="ta" id="nGen" rows="5">${esc(board.notes.general)}</textarea></div>
    <div class="sheet-actions"><button class="btn" type="button" id="doneBtn">Done</button><button class="btn line" type="button" id="btnLogout">Lock board</button></div>`);
  const trash='<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7Zm3-4h6l1 2h4v2H4V5h4l1-2Z"/></svg>';
  const drawJobs=()=>{ const l=el.querySelector('#jobList'); l.innerHTML=''; board.jobs.forEach((j,i)=>{ const row=document.createElement('div'); row.className='row'; const ds=jobDays(j); row.innerHTML=`<span class="grow">${jobChipHTML(j)}${ds?`<span class="micro" style="margin-left:4px">${ds.join(' · ')}</span>`:''}</span><button type="button" class="icon-btn del" title="Remove">${trash}</button>`;
      row.querySelector('button').onclick=()=>{ board.jobs.splice(i,1); Object.values(board.days).forEach(d=>{ for(const id of Object.keys(d.jobs)){ d.jobs[id]=d.jobs[id].filter(x=>x!==j); if(!d.jobs[id].length) delete d.jobs[id]; } }); commit(); drawJobs(); }; l.appendChild(row); }); };
  const drawLunch=()=>{ const l=el.querySelector('#lunchList'); l.innerHTML=''; board.lunches.forEach((v,i)=>{ const row=document.createElement('div'); row.className='row'; row.innerHTML=`<span class="grow">${esc(v)}</span><button type="button" class="icon-btn del" title="Remove">${trash}</button>`; row.querySelector('button').onclick=()=>{ board.lunches.splice(i,1); commit(); drawLunch(); }; l.appendChild(row); }); };
  drawJobs(); drawLunch();
  el.querySelector('#addJob').onsubmit=e=>{ e.preventDefault(); const inp=e.target.querySelector('input'); const v=inp.value.trim(); if(v&&!board.jobs.includes(v)){ board.jobs.push(v); commit(); drawJobs(); } inp.value=''; };
  el.querySelector('#addLunch').onsubmit=e=>{ e.preventDefault(); const inp=e.target.querySelector('input'); const v=inp.value.trim(); if(v&&!board.lunches.includes(v)){ board.lunches.push(v); board.lunches.sort(); commit(); drawLunch(); } inp.value=''; };
  const bind=(sel,key)=>{ el.querySelector(sel).onchange=e=>{ board.notes[key]=e.target.value.trim(); commit(); }; };
  bind('#nPen','penTasks'); bind('#nFri','fridayClean'); bind('#nGen','general');
  el.querySelector('#doneBtn').onclick=closeSheet;
  el.querySelector('#btnLogout').onclick=()=>{ closeSheet(); logout(); };
}

/* ===================== SHARE CARD ===================== */
function buildShareCard(){
  const d=getDay(viewDate); const n=board.notes; const fri=isFriday(viewDate); const dt=parseISO(viewDate);
  let rows='';
  PENS.forEach(p=>{
    if(!d[p.key].length) return;
    rows+=`<tr class="grp"><td colspan="3"><span class="band ${p.key}"><span class="emo">${p.emo}</span>${p.label}</span></td></tr>`;
    d[p.key].forEach(id=>{ const s=staffById(id); if(!s) return;
      rows+=`<tr><td class="who"><span class="av" style="background:${s.hue}">${initials(s.name)}</span>${esc(s.name)}</td><td class="lunch">${d.lunch[id]?esc(d.lunch[id]):'<span class="muted">—</span>'}${d.radio[id]?'<span class="tag">📻 Radio 1st</span>':''}</td><td>${(d.jobs[id]||[]).map(j=>`<span class="job">${jobChipHTML(j)}</span>`).join('')||'<span class="muted">—</span>'}</td></tr>`;
    });
  });
  const todo=jobsForDay(viewDate).filter(j=>!holdersOf(d,j).length);
  document.getElementById('shareCard').innerHTML=`
    <div class="hd"><img src="/assets/logo.png" alt=""><div><p class="micro">Duncan's Dog Co · Team</p><h1>Staff Positioning</h1></div><div class="date"><div class="d">${dt.toLocaleDateString('en-GB',{weekday:'long'})}</div><span class="micro">${dt.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span></div></div>
    <div class="body">
    <table><thead><tr><th style="width:28%">Staff</th><th style="width:22%">🍽 Lunch</th><th>📋 Jobs</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="muted" style="padding:20px 0">No positions set for this day yet.</td></tr>'}</tbody></table>
    ${todo.length?`<div class="todo">Still needs someone: <b>${todo.map(j=>jobEmoji(j)+' '+esc(jobLabel(j))).join(' · ')}</b></div>`:''}
    <div class="foot">
      <div class="fbox"><span class="micro">🌳 Woodland pen · every day</span>${esc(n.penTasks)}</div>
      <div class="fbox"><span class="micro">☀️ Sahara / Top pen · every day</span>${esc(n.penTasks)}</div>
      ${fri?`<div class="fbox fri wide"><span class="micro">🧹 Friday clean</span>${esc(n.fridayClean)}</div>`:''}
      <div class="fbox wide"><span class="micro">📌 General notes</span>${esc(n.general)}</div>
    </div>
    <div class="ft"><span>Duncan's Dog Co</span><span>Daily team board</span></div>
    </div>`;
}
async function shareImage(){
  buildShareCard();
  const btn=document.getElementById('btnShare'); btn.disabled=true;
  try{
    const canvas=await html2canvas(document.getElementById('shareCard'),{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const file=new File([blob],`staff-positioning-${viewDate}.png`,{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Staff Positioning '+fmtShort(viewDate)}); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Image downloaded'); }
  }catch(e){ if(e.name!=='AbortError') toast('Could not make the image. Try Print instead.'); }
  btn.disabled=false;
}

/* ===================== WIRING ===================== */
document.getElementById('btnShare').onclick=shareImage;
document.getElementById('btnPrint').onclick=()=>{ buildShareCard(); window.print(); };
window.addEventListener('beforeprint',buildShareCard);
document.getElementById('btnTeam').onclick=openTeamSheet;
document.getElementById('btnSettings').onclick=openSettingsSheet;
document.getElementById('prevWeek').onclick=()=>{ weekStart=addDays(weekStart,-7); viewDate=addDays(viewDate,-7); render(); };
document.getElementById('nextWeek').onclick=()=>{ weekStart=addDays(weekStart,7); viewDate=addDays(viewDate,7); render(); };
function copyFrom(iso){ const src=board.days[iso]; if(!src) return; board.days[viewDate]=cleanDay(JSON.parse(JSON.stringify(src))); commit(); toast('Copied from '+fmtShort(iso)); }
document.getElementById('btnCopyYesterday').onclick=()=>{ if(dayHasContent(viewDate)&&!confirm('Replace this day with yesterday\'s board?')) return; copyFrom(addDays(viewDate,-1)); };
document.getElementById('btnCopyLastWeek').onclick=()=>{ if(dayHasContent(viewDate)&&!confirm('Replace this day with the same day last week?')) return; copyFrom(addDays(viewDate,-7)); };
document.getElementById('btnClearDay').onclick=()=>{ if(!dayHasContent(viewDate)) return; if(confirm('Clear everyone off '+fmtShort(viewDate)+'?')){ delete board.days[viewDate]; selected=null; selectedJob=null; commit(); } };
document.getElementById('bench').addEventListener('click',e=>{ if(selected && !e.target.closest('.chip')) move(selected,'bench'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); if(selected||selectedJob){ selected=null; selectedJob=null; render(); } } });
window.addEventListener('beforeunload',()=>{ if(dirty && !localMode){ saveNow(); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pollRemote(); });
setInterval(pollRemote, 20000);

(()=>{ let saved=''; try{ saved=localStorage.getItem('ddc-team-pin')||''; }catch{} if(saved) tryOpen(saved); })();
