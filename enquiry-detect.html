<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Form Detection</title></head>
<body>
<!-- Netlify form detection file - do not remove -->
<form name="enquiry" netlify netlify-honeypot="bot-field" action="/thank-you/" hidden>
  <input type="hidden" name="form-name" value="enquiry">
  <input type="hidden" name="subject">
  <input name="bot-field">
  <input type="text" name="name">
  <input type="email" name="email">
  <input type="tel" name="phone">
  <input type="text" name="dog_name">
  <input type="text" name="breed">
  <input type="text" name="dog_age">
  <textarea name="address"></textarea>
  <select name="service"></select>
  <textarea name="message"></textarea>
  <button type="submit">Submit</button>
</form>
</body>
</html>
